name: Plugin release validation

on:
  pull_request:
    paths:
      - ".github/workflows/plugin-release-validation.yml"
      - ".claude-plugin/**"
      - "install.sh"
      - "package.json"
      - "plugin/**"
      - "specs/portable-prd-agent-plugin/**"
  push:
    tags:
      - "v*"

jobs:
  pinned-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Install exact host pins
        run: >-
          npm install --global
          opencode-ai@1.18.29
          @openai/codex@0.153.3
          @anthropic-ai/claude-code@2.1.257
          @earendil-works/pi-coding-agent@0.85.0
      - name: Validate release against pinned hosts
        run: KONA_RELEASE_VALIDATION=1 bun run test:plugin
      - run: bun run plugin:validate
